<div class="snake-container">
  <div class="game-header">
    <div class="score-panel">
      <div class="score-item">
        <span class="score-label">Puntuación</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Récord</span>
        <span class="score-value" id="highScore">0</span>
      </div>
    </div>
  </div>
  <div class="game-canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="gameOver" class="game-over">
      <h2>Game Over!</h2>
      <p>Pulsa "Jugar de nuevo" para reintentar</p>
    </div>
  </div>
  <div class="game-controls">
    <button id="startBtn" class="start-btn">Iniciar Juego</button>
    <div class="controls-info">
      <p>🎮 Usa las flechas del teclado para mover</p>
    </div>
  </div>
</div>
